<style>
:root {
  --paper: #EEF1E6;
  --card: #FBFBF7;
  --forest-dark: #1F3A2A;
  --forest: #2F523A;
  --gold: #C98F3C;
  --ink: #22301D;
  --ink-secondary: #5B6656;
  --line: rgba(34,48,29,0.14);
  --danger: #A6473B;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
  background: var(--paper);
}

#app-main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 18px) 16px 32px;
}

.nav-title-bar { display:flex; align-items:center; gap:8px; margin-bottom: 6px; min-height: 28px; }
.nav-title-bar h1 { font-family: ui-serif, Georgia, serif; font-weight: 500; font-size: 22px; margin: 0; color: var(--forest-dark); }
.detail-title { font-family: ui-serif, Georgia, serif; font-weight: 500; font-size: 22px; margin: 2px 0 2px; color: var(--forest-dark); }
.detail-subtitle { margin-top: 0; margin-bottom: 14px; }

.back-btn {
  background: none; border: none; padding: 4px 0; margin: 0 0 2px;
  font-size: 15px; color: var(--forest); font-family: inherit; cursor: pointer;
}
.back-btn:active { opacity: .6; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin: 0 0 16px;
}
.card-title { font-family: ui-serif, Georgia, serif; font-weight: 500; font-size: 18px; margin: 0 0 6px; color: var(--forest-dark); }
.card-hint { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; line-height: 1.45; }
.notes-card p { font-size: 14px; color: var(--ink-secondary); margin: 0 0 8px; line-height: 1.5; }
.notes-card p:last-child { margin-bottom: 0; }

.age-line { font-family: ui-serif, Georgia, serif; font-size: 19px; margin: 0 0 4px; color: var(--forest-dark); }

.progress-label { font-size: 14px; margin: 0 0 8px; color: var(--ink); }
.progress-track { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); border-radius: 5px; transition: width .4s ease; }

.link-btn {
  background: none; border: none; padding: 8px 0 0; margin: 0;
  font-size: 14px; color: var(--forest); font-family: inherit; cursor: pointer; text-decoration: underline;
}

.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--ink-secondary); margin-bottom: 4px; }
.field input {
  width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line);
  background: #fff; font-size: 16px; font-family: inherit; color: var(--ink);
}
.field input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

.field-actions { display: flex; gap: 10px; margin-top: 4px; }
.btn-primary, .btn-secondary { border: none; border-radius: 9px; padding: 10px 16px; font-size: 15px; font-family: inherit; cursor: pointer; }
.btn-primary { background: var(--forest-dark); color: #fff; }
.btn-primary:active { background: var(--forest); }
.btn-secondary { background: var(--line); color: var(--ink); }
.btn-danger {
  background: none; border: 1px solid var(--danger); color: var(--danger); width: 100%;
  padding: 12px; border-radius: 10px; font-family: inherit; font-size: 15px; cursor: pointer;
}
.btn-danger:active { background: rgba(166,71,59,0.08); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.section-block { margin-bottom: 26px; }
.section-heading { font-family: ui-serif, Georgia, serif; font-weight: 500; font-size: 17px; color: var(--forest-dark); margin: 0 0 8px; }
.stage-name { font-size: 15px; color: var(--ink); margin: 0 0 2px; font-weight: 600; }

.checklist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: flex-start; gap: 12px; padding: 11px 2px;
  border-bottom: 1px solid var(--line); cursor: pointer;
}
.row-check {
  flex: 0 0 21px; width: 21px; height: 21px; margin-top: 1px;
  border: 2px solid var(--forest); border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s ease, border-color .15s ease;
}
.row.is-checked .row-check { background: var(--forest); border-color: var(--forest); }
.row-check svg { width: 12px; height: 12px; }
.row-text { flex: 1; font-size: 16px; line-height: 1.4; color: var(--ink); }
.row.is-checked .row-text { color: var(--ink-secondary); text-decoration: line-through; text-decoration-color: var(--ink-secondary); }

.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.list-row-emoji { font-size: 22px; flex: 0 0 auto; }
.list-row-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.list-row-title { font-size: 16px; color: var(--ink); }
.list-row-sub { font-size: 12.5px; color: var(--ink-secondary); }
.list-row-chevron { color: var(--ink-secondary); font-size: 20px; }

.plain-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.plain-list li { padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink); }

.reminder-quote {
  margin: 0; padding: 14px 16px; background: var(--card); border-left: 3px solid var(--gold);
  border-radius: 0 10px 10px 0; font-family: ui-serif, Georgia, serif; font-size: 15.5px;
  line-height: 1.55; color: var(--ink); font-style: italic;
}

.milestone-list { border-top: none; }
.milestone-row { border-bottom: 1px solid var(--line); padding: 10px 2px; }
.milestone-toggle-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.milestone-date { margin: 8px 0 2px 33px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); font-family: inherit; font-size: 14px; }
.is-checked-text { color: var(--ink-secondary); text-decoration: line-through; }

#tab-bar {
  display: flex; border-top: 1px solid var(--line); background: var(--card);
  padding: 6px 4px calc(env(safe-area-inset-bottom) + 4px);
  flex: 0 0 auto;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; padding: 6px 2px; color: var(--ink-secondary);
  font-family: inherit; font-size: 10.5px; cursor: pointer;
}
.tab-btn svg { width: 22px; height: 22px; }
.tab-btn.active { color: var(--forest-dark); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

  "Reading","Music","Dancing","Movement","Floor Time","Outdoor Time","Play",
  "Human Connection","Curiosity","Rest","Laughter","Safe Exploration","Family Time"
];

const WONT_WORRY = [
  "Making him “advanced” compared with other babies",
  "Expensive developmental toys",
  "Flashcards for babies",
  "Academic pressure",
  "Comparing milestones with other children",
  "Trying to accelerate every skill",
  "Filling every minute with activities",
  "Making him perform songs, dances, or tricks",
  "Expecting him to enjoy every activity",
  "Forcing social interaction",
  "Forcing movement before he is ready",
  "Treating every outing as a developmental lesson",
  "Feeling guilty when we need quiet days",
  "Comparing his personality with other children"
];

const CORE_REMINDER = "My goal is not to create a perfect child. My goal is to give my son a healthy body, a secure heart, a curious mind, confidence to explore, the ability to think for himself, and the knowledge that he is deeply loved. If I consistently provide love, safety, conversation, reading, movement, music, dancing, healthy nutrition, sleep, play, and opportunities to explore, I am giving him an extraordinary foundation for reaching his own best potential.";

// ================== BUILD INDEXED DATA ==================
function buildSections(raw) {
  return raw.map(s => ({
    id: s.id, emoji: s.emoji, title: s.title, notes: s.notes || [],
    groups: s.groups.map(g => ({
      id: g.id, title: g.title,
      items: g.rawItems.map((text, i) => ({ id: g.id + "." + i, text: text }))
    }))
  }));
}
function buildRoadmap(raw) {
  return raw.map(s => ({
    id: s.id, title: s.title, subtitle: s.subtitle,
    items: s.rawItems.map((text, i) => ({ id: "roadmap." + s.id + "." + i, text: text }))
  }));
}

const PLAN_SECTIONS = buildSections(RAW_SECTIONS);
const ROADMAP_STAGES = buildRoadmap(RAW_ROADMAP);
const DAILY_SECTION = PLAN_SECTIONS.find(function(s){ return s.id === "daily"; });
const PHYSICAL_SECTION = PLAN_SECTIONS.find(function(s){ return s.id === "physical"; });
const READING_SECTION = PLAN_SECTIONS.find(function(s){ return s.id === "reading"; });

function sectionItemIds(section) {
  var ids = [];
  section.groups.forEach(function(g){ g.items.forEach(function(i){ ids.push(i.id); }); });
  return ids;
}
function allItemIds() {
  var ids = [];
  PLAN_SECTIONS.forEach(function(s){ ids = ids.concat(sectionItemIds(s)); });
  return ids;
}

// ================== AGE HELPERS ==================
function parseISODate(iso) {
  var parts = iso.split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}
function todayISO() {
  var d = new Date();
  function pad(n) { return String(n).padStart(2, "0"); }
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function ageInDays(birth, asOf) {
  asOf = asOf || new Date();
  var start = new Date(birth.getFullYear(), birth.getMonth(), birth.getDate());
  var end = new Date(asOf.getFullYear(), asOf.getMonth(), asOf.getDate());
  return Math.round((end - start) / 86400000);
}
function ageMonthsDays(birth, asOf) {
  asOf = asOf || new Date();
  var months = (asOf.getFullYear() - birth.getFullYear()) * 12 + (asOf.getMonth() - birth.getMonth());
  var days = asOf.getDate() - birth.getDate();
  if (days < 0) {
    months -= 1;
    var prevMonthLastDay = new Date(asOf.getFullYear(), asOf.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if (months < 0) { months = 0; }
  return { months: months, days: Math.max(days, 0) };
}
function ageInMonthsFraction(birth, asOf) {
  return Math.max(ageInDays(birth, asOf), 0) / 30.4375;
}
function roadmapStageForMonths(m) {
  if (m < 1) return ROADMAP_STAGES[0];
  if (m < 3) return ROADMAP_STAGES[1];
  if (m < 6) return ROADMAP_STAGES[2];
  if (m < 9) return ROADMAP_STAGES[3];
  return ROADMAP_STAGES[4];
}
function physicalGroupForMonths(m) {
  if (m < 3) return PHYSICAL_SECTION.groups[0];
  if (m < 6) return PHYSICAL_SECTION.groups[1];
  if (m < 9) return PHYSICAL_SECTION.groups[2];
  return PHYSICAL_SECTION.groups[3];
}
function readingGroupForMonths(m) {
  if (m < 3) return READING_SECTION.groups[1];
  if (m < 6) return READING_SECTION.groups[2];
  return READING_SECTION.groups[3];
}

// ================== PERSISTENCE ==================
const KEYS = { checked: "babyplan.checkedIds.v1", milestones: "babyplan.milestones.v1", profile: "babyplan.profile.v1" };

function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

function loadChecked() {
  try {
    var raw = safeGet(KEYS.checked);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) { return new Set(); }
}
function loadMilestones() {
  try {
    var raw = safeGet(KEYS.milestones);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return MILESTONE_TITLES.map(function(t, i) { return { id: "milestone." + i, title: t, achieved: false, date: null }; });
}
function loadProfile() {
  try {
    var raw = safeGet(KEYS.profile);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { name: "", birthDate: null };
}

const state = { checked: loadChecked(), milestones: loadMilestones(), profile: loadProfile() };

function saveChecked() { safeSet(KEYS.checked, JSON.stringify(Array.from(state.checked))); }
function saveMilestones() { safeSet(KEYS.milestones, JSON.stringify(state.milestones)); }
function saveProfile() { safeSet(KEYS.profile, JSON.stringify(state.profile)); }

function progressCounts(ids) {
  var done = ids.filter(function(id){ return state.checked.has(id); }).length;
  return { done: done, total: ids.length };
}

// ================== UI STATE ==================
const ui = { tab: "today", sectionDetail: null, stageDetail: null, editingProfile: false };

// ================== RENDER HELPERS ==================
function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, function(c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.2 11.7L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function checklistRowHTML(item) {
  var checked = state.checked.has(item.id);
  return '<li class="row' + (checked ? " is-checked" : "") + '" data-item-id="' + escapeHTML(item.id) + '">' +
    '<span class="row-check">' + (checked ? CHECK_SVG : "") + '</span>' +
    '<span class="row-text">' + escapeHTML(item.text) + '</span></li>';
}
function checklistHTML(items) {
  return '<ul class="checklist">' + items.map(checklistRowHTML).join("") + '</ul>';
}

// ================== VIEW: TODAY ==================
function todayHTML() {
  var ids = allItemIds();
  var counts = progressCounts(ids);
  var pct = counts.total ? Math.round(100 * counts.done / counts.total) : 0;
  var hasProfile = !!state.profile.birthDate;

  var profileBlock = "";
  var suggestionsBlock = "";

  if (hasProfile && !ui.editingProfile) {
    var birth = parseISODate(state.profile.birthDate);
    var md = ageMonthsDays(birth);
    var monthsFrac = ageInMonthsFraction(birth);
    var name = state.profile.name.trim() || "Your baby";

    profileBlock =
      '<section class="card">' +
        '<p class="age-line">' + escapeHTML(name) + ' is ' + md.months + ' month' + (md.months === 1 ? "" : "s") +
        ', ' + md.days + ' day' + (md.days === 1 ? "" : "s") + ' old</p>' +
        '<p class="card-hint">Suggestions below are matched to this age automatically.</p>' +
        '<button class="link-btn" data-action="edit-profile">Edit</button>' +
      '</section>';

    var stage = roadmapStageForMonths(monthsFrac);
    var physicalGroup = physicalGroupForMonths(monthsFrac);
    var readingGroup = readingGroupForMonths(monthsFrac);
    var readingTarget = READING_SECTION.groups[0];

    suggestionsBlock =
      '<div class="section-block">' +
        '<h2 class="section-heading">📅 This Stage</h2>' +
        '<p class="stage-name">' + escapeHTML(stage.title) + '</p>' +
        '<p class="card-hint">' + escapeHTML(stage.subtitle) + '</p>' +
        checklistHTML(stage.items) +
      '</div>' +
      '<div class="section-block">' +
        '<h2 class="section-heading">💪 Physical Development</h2>' +
        '<p class="stage-name">' + escapeHTML(physicalGroup.title) + '</p>' +
        checklistHTML(physicalGroup.items) +
      '</div>' +
      '<div class="section-block">' +
        '<h2 class="section-heading">📚 Reading</h2>' +
        '<p class="stage-name">' + escapeHTML(readingGroup.title) + '</p>' +
        checklistHTML(readingTarget.items) +
        checklistHTML(readingGroup.items) +
      '</div>';
  } else {
    profileBlock =
      '<section class="card">' +
        '<h2 class="card-title">Get suggestions for today</h2>' +
        '<p class="card-hint">Add your baby&#39;s name and birth date and this tab will automatically surface the right activities for their current age.</p>' +
        '<label class="field"><span>Name</span>' +
          '<input type="text" id="profile-name-input" value="' + escapeHTML(state.profile.name) + '" placeholder="Baby\u2019s name"></label>' +
        '<label class="field"><span>Birth date</span>' +
          '<input type="date" id="profile-date-input" value="' + escapeHTML(state.profile.birthDate || "") + '" max="' + todayISO() + '"></label>' +
        '<div class="field-actions">' +
          '<button class="btn-primary" data-action="save-profile">Save</button>' +
          (hasProfile ? '<button class="btn-secondary" data-action="cancel-edit-profile">Cancel</button>' : "") +
        '</div>' +
      '</section>';
  }

  return (
    '<div class="nav-title-bar"><h1>Today</h1></div>' +
    '<section class="card">' +
      '<p class="progress-label">' + counts.done + ' of ' + counts.total + ' activities checked off</p>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '</section>' +
    profileBlock +
    suggestionsBlock +
    '<div class="section-block">' +
      '<h2 class="section-heading">⭐ Daily Foundation</h2>' +
      checklistHTML(DAILY_SECTION.groups[0].items) +
    '</div>'
  );
}

// ================== VIEW: SECTIONS ==================
function sectionsListHTML() {
  var rows = PLAN_SECTIONS.map(function(s) {
    var ids = sectionItemIds(s);
    var c = progressCounts(ids);
    return '<li class="list-row" data-open-section="' + s.id + '">' +
      '<span class="list-row-emoji">' + s.emoji + '</span>' +
      '<span class="list-row-body">' +
        '<span class="list-row-title">' + escapeHTML(s.title) + '</span>' +
        '<span class="list-row-sub">' + c.done + ' of ' + c.total + ' done</span>' +
      '</span>' +
      '<span class="list-row-chevron">&rsaquo;</span>' +
    '</li>';
  }).join("");
  return '<div class="nav-title-bar"><h1>Sections</h1></div><ul class="list">' + rows + '</ul>';
}

function sectionDetailHTML(id) {
  var section = PLAN_SECTIONS.find(function(s){ return s.id === id; });
  if (!section) return sectionsListHTML();
  var notesHTML = section.notes.length
    ? '<section class="card notes-card">' + section.notes.map(function(n){ return '<p>' + escapeHTML(n) + '</p>'; }).join("") + '</section>'
    : "";
  var groupsHTML = section.groups.map(function(g) {
    return '<div class="section-block"><h2 class="section-heading">' + escapeHTML(g.title) + '</h2>' + checklistHTML(g.items) + '</div>';
  }).join("");
  return (
    '<div class="nav-title-bar"><button class="back-btn" data-action="back-sections">&lsaquo; Sections</button></div>' +
    '<h1 class="detail-title">' + section.emoji + ' ' + escapeHTML(section.title) + '</h1>' +
    notesHTML + groupsHTML
  );
}

// ================== VIEW: ROADMAP ==================
function roadmapListHTML() {
  var rows = ROADMAP_STAGES.map(function(stage) {
    var ids = stage.items.map(function(i){ return i.id; });
    var c = progressCounts(ids);
    return '<li class="list-row" data-open-stage="' + stage.id + '">' +
      '<span class="list-row-body">' +
        '<span class="list-row-title">' + escapeHTML(stage.title) + '</span>' +
        '<span class="list-row-sub">' + escapeHTML(stage.subtitle) + '</span>' +
        '<span class="list-row-sub">' + c.done + ' of ' + c.total + ' done</span>' +
      '</span>' +
      '<span class="list-row-chevron">&rsaquo;</span>' +
    '</li>';
  }).join("");
  return '<div class="nav-title-bar"><h1>Age-by-Age Roadmap</h1></div><ul class="list">' + rows + '</ul>';
}

function stageDetailHTML(id) {
  var stage = ROADMAP_STAGES.find(function(s){ return s.id === id; });
  if (!stage) return roadmapListHTML();
  return (
    '<div class="nav-title-bar"><button class="back-btn" data-action="back-roadmap">&lsaquo; Roadmap</button></div>' +
    '<h1 class="detail-title">' + escapeHTML(stage.title) + '</h1>' +
    '<p class="card-hint detail-subtitle">' + escapeHTML(stage.subtitle) + '</p>' +
    '<div class="section-block"><h2 class="section-heading">Primary Goals</h2>' + checklistHTML(stage.items) + '</div>'
  );
}

// ================== VIEW: MILESTONES ==================
function milestonesHTML() {
  var rows = state.milestones.map(function(m) {
    var dateInput = m.achieved
      ? '<input type="date" class="milestone-date" data-milestone-date="' + escapeHTML(m.id) + '" value="' + escapeHTML(m.date || todayISO()) + '">'
      : "";
    return '<li class="milestone-row">' +
      '<div class="milestone-toggle-row" data-milestone-toggle="' + escapeHTML(m.id) + '">' +
        '<span class="row-check' + (m.achieved ? " is-checked" : "") + '">' + (m.achieved ? CHECK_SVG : "") + '</span>' +
        '<span class="row-text' + (m.achieved ? " is-checked-text" : "") + '">' + escapeHTML(m.title) + '</span>' +
      '</div>' + dateInput +
    '</li>';
  }).join("");
  return '<div class="nav-title-bar"><h1>Milestones</h1></div><ul class="list milestone-list">' + rows + '</ul>';
}

// ================== VIEW: MORE ==================
function moreHTML() {
  var hasProfile = !!state.profile.birthDate;
  var profileSection;
  if (ui.editingProfile || !hasProfile) {
    profileSection =
      '<section class="card">' +
        '<label class="field"><span>Name</span>' +
          '<input type="text" id="profile-name-input-more" value="' + escapeHTML(state.profile.name) + '" placeholder="Baby\u2019s name"></label>' +
        '<label class="field"><span>Birth date</span>' +
          '<input type="date" id="profile-date-input-more" value="' + escapeHTML(state.profile.birthDate || "") + '" max="' + todayISO() + '"></label>' +
        '<div class="field-actions">' +
          '<button class="btn-primary" data-action="save-profile-more">Save</button>' +
          (hasProfile ? '<button class="btn-secondary" data-action="cancel-edit-profile">Cancel</button>' : "") +
        '</div>' +
      '</section>';
  } else {
    var birth = parseISODate(state.profile.birthDate);
    var md = ageMonthsDays(birth);
    profileSection =
      '<section class="card">' +
        '<p class="age-line">' + escapeHTML(state.profile.name || "Unnamed") + '</p>' +
        '<p class="card-hint">' + md.months + ' months, ' + md.days + ' days old</p>' +
        '<button class="link-btn" data-action="edit-profile">Edit Profile</button>' +
      '</section>';
  }

  return (
    '<div class="nav-title-bar"><h1>More</h1></div>' +
    '<div class="section-block"><h2 class="section-heading">👶 Baby Profile</h2>' + profileSection + '</div>' +
    '<div class="section-block"><h2 class="section-heading">🏆 My First-Year Priorities</h2>' +
      '<ul class="plain-list">' + PRIORITIES.map(function(p){ return '<li>' + escapeHTML(p) + '</li>'; }).join("") + '</ul>' +
    '</div>' +
    '<div class="section-block"><h2 class="section-heading">🚫 Things I Will Not Worry About</h2>' +
      '<ul class="plain-list">' + WONT_WORRY.map(function(p){ return '<li>' + escapeHTML(p) + '</li>'; }).join("") + '</ul>' +
    '</div>' +
    '<div class="section-block"><h2 class="section-heading">❤️ Core Parenting Reminder</h2>' +
      '<blockquote class="reminder-quote">' + escapeHTML(CORE_REMINDER) + '</blockquote>' +
    '</div>' +
    '<div class="section-block"><button class="btn-danger" data-action="reset-all">Reset all checkmarks</button></div>'
  );
}

// ================== DISPATCH / RENDER ==================
const appMain = document.getElementById("app-main");

function currentViewHTML() {
  switch (ui.tab) {
    case "today": return todayHTML();
    case "sections": return ui.sectionDetail ? sectionDetailHTML(ui.sectionDetail) : sectionsListHTML();
    case "roadmap": return ui.stageDetail ? stageDetailHTML(ui.stageDetail) : roadmapListHTML();
    case "milestones": return milestonesHTML();
    case "more": return moreHTML();
    default: return todayHTML();
  }
}

function render() {
  appMain.innerHTML = currentViewHTML();
  document.querySelectorAll(".tab-btn").forEach(function(btn) {
    btn.classList.toggle("active", btn.dataset.tab === ui.tab);
  });
}

function rerenderPreservingScroll() {
  var y = appMain.scrollTop;
  render();
  appMain.scrollTop = y;
}

// ================== ACTIONS ==================
function toggleItem(id) {
  if (state.checked.has(id)) state.checked.delete(id); else state.checked.add(id);
  saveChecked();
  rerenderPreservingScroll();
}
function toggleMilestone(id) {
  var m = state.milestones.find(function(x){ return x.id === id; });
  if (!m) return;
  m.achieved = !m.achieved;
  if (m.achieved && !m.date) m.date = todayISO();
  saveMilestones();
  rerenderPreservingScroll();
}
function readProfileInputs(nameId, dateId) {
  var nameEl = document.getElementById(nameId);
  var dateEl = document.getElementById(dateId);
  return { name: nameEl ? nameEl.value : "", birthDate: (dateEl && dateEl.value) ? dateEl.value : null };
}
function saveProfileFrom(nameId, dateId) {
  var vals = readProfileInputs(nameId, dateId);
  state.profile.name = vals.name;
  state.profile.birthDate = vals.birthDate;
  saveProfile();
  ui.editingProfile = false;
  render();
}

// ================== EVENTS ==================
appMain.addEventListener("click", function(e) {
  var el;

  el = e.target.closest("[data-item-id]");
  if (el) { toggleItem(el.dataset.itemId); return; }

  el = e.target.closest("[data-open-section]");
  if (el) { ui.sectionDetail = el.dataset.openSection; render(); return; }

  el = e.target.closest("[data-open-stage]");
  if (el) { ui.stageDetail = el.dataset.openStage; render(); return; }

  el = e.target.closest('[data-action="back-sections"]');
  if (el) { ui.sectionDetail = null; render(); return; }

  el = e.target.closest('[data-action="back-roadmap"]');
  if (el) { ui.stageDetail = null; render(); return; }

  el = e.target.closest("[data-milestone-toggle]");
  if (el) { toggleMilestone(el.dataset.milestoneToggle); return; }

  el = e.target.closest('[data-action="save-profile"]');
  if (el) { saveProfileFrom("profile-name-input", "profile-date-input"); return; }

  el = e.target.closest('[data-action="save-profile-more"]');
  if (el) { saveProfileFrom("profile-name-input-more", "profile-date-input-more"); return; }

  el = e.target.closest('[data-action="edit-profile"]');
  if (el) { ui.editingProfile = true; render(); return; }

  el = e.target.closest('[data-action="cancel-edit-profile"]');
  if (el) { ui.editingProfile = false; render(); return; }

  el = e.target.closest('[data-action="reset-all"]');
  if (el) {
    if (confirm("Reset every checked item in Daily, Sections, and Roadmap checklists? Milestones are kept.")) {
      state.checked = new Set();
      saveChecked();
      render();
    }
    return;
  }
});

appMain.addEventListener("change", function(e) {
  var dateInput = e.target.closest("[data-milestone-date]");
  if (dateInput) {
    var m = state.milestones.find(function(x){ return x.id === dateInput.dataset.milestoneDate; });
    if (m) { m.date = dateInput.value; saveMilestones(); }
  }
});

document.querySelectorAll(".tab-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    ui.tab = btn.dataset.tab;
    ui.sectionDetail = null;
    ui.stageDetail = null;
    ui.editingProfile = false;
    render();
  });
});

render();
</script>
</body>
</html>
